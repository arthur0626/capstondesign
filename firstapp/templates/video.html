{% extends 'base.html' %}
{% load static %}

{% block title %}영상 생성{% endblock %}

{% block content %}
<div class="page-container" style="max-width: 800px; margin: 40px auto; padding: 20px;">
    
    <div class="card-box" style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
        <h2 style="text-align: center; color: #333; margin-bottom: 30px;">🎥 광고 영상 생성</h2>
        
        <form id="videoForm" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset style="border: 1px solid #ddd; border-radius: 8px; padding: 15px;">
                <legend style="font-weight: bold;">영상 설정</legend>
                <div><label>📷 이미지:</label><input type="file" name="video_image" required></div>
                </fieldset>

            <div style="text-align: center; margin-top: 30px;">
                <button type="submit" style="background-color: #fd7e14; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer;">
                    🎥 영상 생성 시작
                </button>
            </div>
        </form>
        
        <div id="videoResult" style="text-align: center; margin-top: 30px;"></div>
    </div>

</div>

<script>
    // handleRealSubmit 함수 재정의 또는 가져오기
    document.getElementById('videoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // ... (영상 요청 AJAX 로직) ...
        // fetch("{% url 'image_to_video' %}", ...)
    });
</script>
{% endblock %}
